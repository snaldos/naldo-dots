# Every external command used below has one preferred provider in
# bootstrap/fedora/{dnf-packages,npm-packages,uv-tools,cargo-tools}.tsv.

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

# BasedPyright owns types, completions, navigation, and type diagnostics. Ruff
# owns import organization, lint fixes, and formatting.
[language-server.basedpyright.config.basedpyright]
disableOrganizeImports = true

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "standard"

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.tinymist]
command = "tinymist"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.harper-ls.config.harper-ls]
dialect = "American"

[language-server.marksman]
command = "marksman"

[language-server.markdown-oxide]
command = "markdown-oxide"

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

# The language server still requires the tsserver API supplied by TypeScript 6;
# TypeScript 7 removed that executable and is intentionally excluded for now.
[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
# A project can instead set this in its local .helix/languages.toml file:
# language-servers = ["ty", "ruff"]
formatter = { command = "ruff", args = ["format", "--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true

[[language]]
name = "typst"
language-servers = ["tinymist", "harper-ls"]
formatter = { command = "typstyle" }
auto-format = true
soft-wrap = { enable = true }

# Marksman supplies general Markdown links and symbols, Harper supplies prose
# diagnostics, and Prettier performs formatting. State Space selects Markdown
# Oxide instead through its project-local .helix/languages.toml.
[[language]]
name = "markdown"
language-servers = ["marksman", "harper-ls"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
soft-wrap = { enable = true }

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt", args = ["-i", "2"] }
auto-format = true

[[language]]
name = "toml"
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["format", "--stdin-filepath", "%{buffer_name}", "-"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "css"
language-servers = ["vscode-css-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true
