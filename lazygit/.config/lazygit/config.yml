os:
  editPreset: "helix (hx)"
git:
  pagers:
    - colorArg: always
      pager: >-
        sh -c 'exec delta --dark --paging=never
        --syntax-theme=ansi --true-color=always
        --minus-style="syntax ${NOCTALIA_DELTA_DELETE:-#3a232a}"
        --minus-emph-style="syntax bold ${NOCTALIA_DELTA_DELETE:-#3a232a}"
        --plus-style="syntax ${NOCTALIA_DELTA_ADD:-#1f3328}"
        --plus-emph-style="syntax bold ${NOCTALIA_DELTA_ADD:-#1f3328}"
        --line-numbers-left-style=blue --line-numbers-right-style=blue
        --line-numbers-minus-style=red --line-numbers-plus-style=green'

    - colorArg: always
      externalDiffCommand: difft --color=always --display=side-by-side
