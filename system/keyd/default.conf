[ids]

*

[main]

# Standard held modifiers. Both physical Alt keys behave as Alt.
shift = layer(shift)
meta = layer(meta)
control = layer(control)
leftalt = layer(alt)
rightalt = layer(alt)

# Tap Caps Lock for Escape; hold it for navigation.
capslock = overload(nav, esc)

# Convenient dedicated editing keys.
home = backspace
end = backspace

pageup = enter
pagedown = enter


[nav]

# Vim-style arrow movement.
h = left
j = down
k = up
l = right

# Terminal copy and paste.
leftbrace = C-S-c
rightbrace = C-S-v

# Restore these physical keys to their standard functions
# while physical Caps Lock is held.
home = home
end = end
pageup = pageup
pagedown = pagedown
